
name: Variables de Entorno Globales

on:
  push:
  workflow_dispatch:

env:
  MENSAJE: "Hola desde GitHub Actions"

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar mensaje original
        run: echo "$MENSAJE"

  job2:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar mensaje en mayúsculas
        run: echo "${MENSAJE^^}"



